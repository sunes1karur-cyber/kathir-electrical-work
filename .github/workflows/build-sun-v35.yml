name: Build SUN Electrical Service v35

on:
  push:
    branches: [ codex/android-v35 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Prepare APK and local signing tools
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifact/SUN-Electrical-Service-v35-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" artifact/zipalign
          chmod +x artifact/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: SUN-Electrical-Service-v35-unsigned
          path: artifact/*
          retention-days: 7
