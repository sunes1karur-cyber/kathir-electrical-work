name: Build Kathir Electrical Work APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kathir-Electrical-Work.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kathir-Electrical-Work-APK
          path: Kathir-Electrical-Work.apk
          retention-days: 30
