name: Build Kathir Electrical Work Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Kathir-Electrical-Work-Windows
          path: windows-app/dist/Kathir-Electrical-Work-Setup-*.exe
          retention-days: 30
